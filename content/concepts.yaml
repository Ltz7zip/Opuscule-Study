# 概念节点与依赖边；坐标用于知识图初始布局
concepts:
  - slug: "elem"
    title_zh: "初等数学"
    title_en: "Elementary Mathematics"
    def_zh: "代数运算、方程、函数与平面几何。它是所有方向的共同前置，本身不指向任何单一专业。"
    def_en: "Algebra, equations, functions, and plane geometry. The shared foundation for every direction, and not tied to any single field."
    field: "math"
    x: 40
    y: 238
    prereq: []
    used_by: ["calc","la","disc"]
  - slug: "calc"
    title_zh: "高等数学"
    title_en: "Calculus"
    def_zh: "极限、导数、积分与级数。它提供描述变化率的语言，是梯度类方法的源头。"
    def_en: "Limits, derivatives, integrals, and series. It supplies the language of change, and is the source of every gradient method."
    field: "math"
    x: 205
    y: 120
    prereq: ["elem"]
    used_by: ["grad"]
  - slug: "la"
    title_zh: "线性代数"
    title_en: "Linear Algebra"
    def_zh: "向量、矩阵、线性变换与特征值。它把高维运算写成可批量计算的形状。"
    def_en: "Vectors, matrices, linear maps, and eigenvalues. It turns high-dimensional work into shapes you can batch."
    field: "math"
    x: 205
    y: 238
    prereq: ["elem"]
    used_by: ["matrix"]
  - slug: "disc"
    title_zh: "离散数学"
    title_en: "Discrete Mathematics"
    def_zh: "逻辑、集合、图论与计数。它是算法与安全类课程的语言基础。"
    def_en: "Logic, sets, graph theory, and counting. The language beneath algorithms and security."
    field: "math"
    x: 205
    y: 356
    prereq: ["elem"]
    used_by: ["sec"]
  - slug: "grad"
    title_zh: "梯度下降"
    title_en: "Gradient Descent"
    def_zh: "沿负梯度方向小步更新参数，使损失下降。步长由学习率控制。"
    def_en: "Step against the gradient to lower the loss. The learning rate controls the step size."
    field: "ai"
    x: 380
    y: 120
    prereq: ["calc"]
    used_by: ["backprop"]
  - slug: "matrix"
    title_zh: "矩阵乘法"
    title_en: "Matrix Multiplication"
    def_zh: "行与列逐项相乘再相加。结果的第 i 行第 j 列，来自左矩阵第 i 行和右矩阵第 j 列。"
    def_en: "Rows meet columns: entry (i, j) of the result is the dot product of row i on the left and column j on the right."
    field: "math"
    x: 380
    y: 238
    prereq: ["la"]
    used_by: ["backprop","dl"]
  - slug: "chain"
    title_zh: "链式法则"
    title_en: "Chain Rule"
    def_zh: "复合函数求导：外层导数乘以内层导数。f(g(x)) 的导数是 f′(g(x))·g′(x)。"
    def_en: "The derivative of a composite function is the product of the layer derivatives: f′(g(x))·g′(x)."
    field: "math"
    x: 545
    y: 46
    prereq: ["calc"]
    used_by: ["backprop"]
  - slug: "backprop"
    title_zh: "反向传播"
    title_en: "Backpropagation"
    def_zh: "从输出层向前，逐层用链式法则计算每个参数的梯度，复用前向缓存的中间结果。"
    def_en: "From the output backwards, use the chain rule layer by layer to compute every parameter gradient, reusing cached forward values."
    field: "ai"
    x: 545
    y: 120
    prereq: ["grad","chain","matrix"]
    used_by: ["dl"]
  - slug: "dl"
    title_zh: "深度学习"
    title_en: "Deep Learning"
    def_zh: "用多层可微函数拟合数据分布。核心是表示学习、梯度优化与规模化训练。"
    def_en: "Fit data distributions with stacks of differentiable functions: representation learning, gradient optimisation, and scale."
    field: "ai"
    x: 700
    y: 190
    prereq: ["backprop","matrix"]
    used_by: []
  - slug: "sec"
    title_zh: "网络安全"
    title_en: "Cybersecurity"
    def_zh: "网络与系统安全的攻防方法，涵盖密码学、认证、漏洞与响应。"
    def_en: "Attack and defense across networks and systems: cryptography, authentication, vulnerabilities, and response."
    field: "cs"
    x: 700
    y: 330
    prereq: ["disc"]
    used_by: []
  - slug: "analysis"
    title_zh: "数学分析"
    title_en: "Mathematical Analysis"
    def_zh: "以集合、映射和极限为语言，严格研究函数与连续变化的学科。"
    def_en: "The rigorous study of functions and continuous change, built on sets, maps, and limits."
    field: "math"
    x: 40
    y: 120
    prereq: ["elem"]
    used_by: ["set"]
  - slug: "set"
    title_zh: "集合"
    title_en: "Set"
    def_zh: "具有确定性质的对象汇成的整体。元素与集合之间用“属于”连接。"
    def_en: "A collection of objects sharing a definite property. Elements belong to the set."
    field: "math"
    x: 40
    y: 46
    prereq: ["analysis"]
    used_by: ["setops","cartesian"]
  - slug: "setops"
    title_zh: "集合运算"
    title_en: "Set Operations"
    def_zh: "并、交、差、补。它们把“或、且、不属于”翻译成集合之间的操作。"
    def_en: "Union, intersection, difference, complement — “or”, “and”, and “not” turned into operations on sets."
    field: "math"
    x: 205
    y: 46
    prereq: ["set"]
    used_by: ["cartesian"]
  - slug: "cartesian"
    title_zh: "Descartes 积"
    title_en: "Cartesian Product"
    def_zh: "A×B 是所有有序对 (x,y) 的集合，其中 x∈A、y∈B。它是坐标与关系的起点。"
    def_en: "A×B is the set of all ordered pairs (x, y) with x in A and y in B. It is where coordinates and relations begin."
    field: "math"
    x: 380
    y: 46
    prereq: ["set","setops"]
    used_by: []
  - slug: "map"
    title_zh: "映射"
    title_en: "Map"
    def_zh: "把集合 A 的每个元素按规则唯一地送到集合 B 的对应元素。映射是函数在任意集合上的推广。"
    def_en: "A rule that sends every element of A to exactly one element of B. Maps generalise functions beyond the number line."
    field: "math"
    x: 205
    y: 190
    prereq: ["set","cartesian"]
    used_by: ["analysis"]
  - slug: "countable"
    title_zh: "可数集"
    title_en: "Countable Set"
    def_zh: "能与自然数集建立一一对应的集合。有理数可数，实数不可数，这是无穷之间也有大小的证据。"
    def_en: "A set that can be put in one-to-one correspondence with the naturals. The rationals are countable, the reals are not."
    field: "math"
    x: 700
    y: 120
    prereq: ["map"]
    used_by: []
  - slug: "linmap"
    title_zh: "线性映射"
    title_en: "Linear Map"
    def_zh: "保持加法与数乘的映射：T(x+y)=T(x)+T(y)，T(cx)=cT(x)。矩阵是它在给定基下的坐标写法。"
    def_en: "A map that preserves addition and scaling: T(x+y)=T(x)+T(y) and T(cx)=cT(x). Matrices are its coordinates in a chosen basis."
    field: "math"
    x: 380
    y: 330
    prereq: ["la"]
    used_by: ["matrix"]
  - slug: "basis"
    title_zh: "基与坐标"
    title_en: "Basis and Coordinates"
    def_zh: "基是一组线性无关且能张满整个空间的向量。选定基之后，每个向量才有唯一的一组坐标。"
    def_en: "A basis is a linearly independent set that spans the space. Choose one, and every vector gets a unique coordinate list."
    field: "math"
    x: 545
    y: 330
    prereq: ["linmap"]
    used_by: ["matrix"]
  - slug: "perceptron"
    title_zh: "感知机"
    title_en: "Perceptron"
    def_zh: "最早的线性分类器：把输入加权求和，过阈值决定类别。它的局限直接催生了多层网络。"
    def_en: "The first linear classifier: a weighted sum of inputs, thresholded into a class. Its limits motivated multilayer networks."
    field: "ai"
    x: 700
    y: 46
    prereq: ["matrix"]
    used_by: ["dl"]
  - slug: "loss"
    title_zh: "损失函数"
    title_en: "Loss Function"
    def_zh: "把预测与目标的差距压缩成一个数，训练就是把这个数往小推。它决定了模型究竟在优化什么。"
    def_en: "A single number summarising the gap between prediction and target. Training pushes that number down, so the loss defines what is optimised."
    field: "ai"
    x: 545
    y: 190
    prereq: ["calc"]
    used_by: ["backprop"]
  - slug: "conv"
    title_zh: "卷积"
    title_en: "Convolution"
    def_zh: "用一个小的卷积核在输入上滑动，每个位置做加权求和。它让同一组参数在整张图上共享。"
    def_en: "Slide a small kernel over the input and take a weighted sum at each position. One parameter set is shared across the whole image."
    field: "ai"
    x: 545
    y: 440
    prereq: ["matrix"]
    used_by: ["cnn"]
  - slug: "pooling"
    title_zh: "池化"
    title_en: "Pooling"
    def_zh: "在小窗口内取最大值或平均值，压缩特征图尺寸。它降低计算量，并带来一定的平移不变性。"
    def_en: "Take the max or mean inside a small window to shrink a feature map: less computation, and a little translation invariance."
    field: "ai"
    x: 700
    y: 440
    prereq: ["conv"]
    used_by: ["cnn"]
  - slug: "cnn"
    title_zh: "卷积神经网络"
    title_en: "Convolutional Network"
    def_zh: "以卷积和池化堆叠成的网络。局部连接、权重共享，使它天然适合图像与网格结构的数据。"
    def_en: "A network stacked from convolutions and pooling. Local connectivity and weight sharing make it a natural fit for images and grids."
    field: "ai"
    x: 860
    y: 440
    prereq: ["conv","pooling"]
    used_by: ["residual"]
  - slug: "residual"
    title_zh: "残差连接"
    title_en: "Residual Connection"
    def_zh: "让一层的输出再加上它的输入：y = F(x) + x。梯度多了一条直通路径，网络因此可以堆得很深。"
    def_en: "Add a layer's input to its output: y = F(x) + x. Gradients get a shortcut, so networks can be stacked much deeper."
    field: "ai"
    x: 860
    y: 330
    prereq: ["cnn"]
    used_by: ["transformer"]
  - slug: "rnn"
    title_zh: "循环神经网络"
    title_en: "Recurrent Network"
    def_zh: "在序列上逐步展开同一个单元，把上一步的隐状态传进下一步。参数在时间上共享。"
    def_en: "Unroll the same cell along a sequence, passing the previous hidden state forward. Parameters are shared across time."
    field: "ai"
    x: 545
    y: 530
    prereq: ["perceptron"]
    used_by: ["lstm"]
  - slug: "lstm"
    title_zh: "长短期记忆"
    title_en: "Long Short-Term Memory"
    def_zh: "带门控的循环单元：遗忘门、输入门、输出门共同控制信息的保留与丢弃，缓解长序列上的梯度消失。"
    def_en: "A gated recurrent cell: forget, input, and output gates decide what to keep and what to drop, easing vanishing gradients over long sequences."
    field: "ai"
    x: 700
    y: 530
    prereq: ["rnn"]
    used_by: ["seq2seq"]
  - slug: "seq2seq"
    title_zh: "序列到序列"
    title_en: "Sequence to Sequence"
    def_zh: "编码器把输入序列压成一个状态，解码器据此逐步生成输出序列。机器翻译是它的经典场景。"
    def_en: "An encoder compresses the input sequence into one state; a decoder generates the output sequence step by step. Machine translation is the classic case."
    field: "ai"
    x: 860
    y: 530
    prereq: ["lstm"]
    used_by: ["attention"]
  - slug: "attention"
    title_zh: "注意力机制"
    title_en: "Attention"
    def_zh: "用查询与键的相似度算出权重，再对值加权求和。它让模型在每一步自行决定看哪里。"
    def_en: "Score queries against keys, turn the scores into weights, and take a weighted sum of values. The model decides where to look at each step."
    field: "ai"
    x: 545
    y: 620
    prereq: ["seq2seq"]
    used_by: ["transformer"]
  - slug: "transformer"
    title_zh: "Transformer"
    title_en: "Transformer"
    def_zh: "完全由注意力堆叠成的架构，没有循环。并行处理整段序列，是当代大模型的基本骨架。"
    def_en: "An architecture built entirely from attention, with no recurrence. It processes a whole sequence in parallel and underpins modern large models."
    field: "ai"
    x: 700
    y: 620
    prereq: ["attention","residual"]
    used_by: ["pretrain"]
  - slug: "pretrain"
    title_zh: "预训练与微调"
    title_en: "Pretraining and Fine-tuning"
    def_zh: "先在大规模通用数据上学一个通用表示，再在小规模任务数据上调整。它把数据成本前移、任务成本压低。"
    def_en: "Learn a general representation on large generic data, then adapt it on small task data. Data cost moves upstream, task cost drops."
    field: "ai"
    x: 860
    y: 620
    prereq: ["transformer","loss"]
    used_by: []
  - slug: "regular"
    title_zh: "正则化"
    title_en: "Regularisation"
    def_zh: "在训练目标上加约束，抑制模型对训练集的过度拟合。权重衰减与 Dropout 是最常用的两种。"
    def_en: "Add a constraint to the training objective to curb overfitting: weight decay and dropout are the two workhorses."
    field: "ai"
    x: 205
    y: 520
    prereq: ["loss"]
    used_by: ["eval"]
  - slug: "batchnorm"
    title_zh: "归一化"
    title_en: "Normalisation"
    def_zh: "把一层的输入按批统计量标准化，再学一个缩放与平移。它稳定训练、允许更大的学习率。"
    def_en: "Standardise a layer's input with batch statistics, then learn a scale and shift. Training stabilises and larger learning rates become viable."
    field: "ai"
    x: 205
    y: 610
    prereq: ["grad"]
    used_by: []
  - slug: "adam"
    title_zh: "自适应优化"
    title_en: "Adaptive Optimisation"
    def_zh: "为每个参数单独维护梯度的一阶与二阶矩估计，并据此调整步长。Adam 是最常用的实现。"
    def_en: "Keep per-parameter estimates of the first and second moments of the gradient and scale the step accordingly. Adam is the common implementation."
    field: "ai"
    x: 380
    y: 520
    prereq: ["grad"]
    used_by: []
  - slug: "eval"
    title_zh: "模型评估"
    title_en: "Model Evaluation"
    def_zh: "在没参与训练的数据上估计泛化表现。划分、交叉验证和误差分析都属于这件事。"
    def_en: "Estimate generalisation on data the model never trained on: splits, cross-validation, and error analysis all belong here."
    field: "ai"
    x: 205
    y: 430
    prereq: ["loss"]
    used_by: ["metric","deploy"]
  - slug: "metric"
    title_zh: "评估指标"
    title_en: "Evaluation Metric"
    def_zh: "把预测与标注的对照压缩成一个可比较的数：准确率、精确率、召回率、F1、AUC 等。"
    def_en: "Compress predictions against labels into one comparable number: accuracy, precision, recall, F1, AUC, and friends."
    field: "ai"
    x: 380
    y: 610
    prereq: ["eval"]
    used_by: []
  - slug: "deploy"
    title_zh: "推理与部署"
    title_en: "Inference and Deployment"
    def_zh: "把训练好的模型放进真实系统：冻结参数、优化延迟与显存、监控输入分布与输出质量。"
    def_en: "Put a trained model into a real system: freeze parameters, tune latency and memory, monitor input drift and output quality."
    field: "ai"
    x: 860
    y: 710
    prereq: ["eval"]
    used_by: []
  - slug: "det"
    title_zh: "行列式"
    title_en: "Determinant"
    def_zh: "把方阵映成一个数：它衡量线性变换对体积的伸缩倍数，也决定矩阵是否可逆。"
    def_en: "A square matrix mapped to one number: the volume scaling of the linear map, and the test for invertibility."
    field: "math"
    x: 40
    y: 780
    prereq: ["matrix"]
    used_by: ["cofactor","cramer"]
  - slug: "cofactor"
    title_zh: "余子式与代数余子式"
    title_en: "Minor and Cofactor"
    def_zh: "划掉某行某列后剩下的小行列式，再配上符号 (-1)^{i+j}。展开公式就靠它们拼起来。"
    def_en: "The smaller determinant left after deleting a row and a column, signed by (-1)^{i+j}. Cofactor expansion is built from them."
    field: "math"
    x: 205
    y: 780
    prereq: ["det"]
    used_by: ["cramer"]
  - slug: "cramer"
    title_zh: "克拉默法则"
    title_en: "Cramer's Rule"
    def_zh: "当系数行列式不为零时，用行列式之比直接写出线性方程组的唯一解。"
    def_en: "When the coefficient determinant is nonzero, the unique solution of a linear system is a ratio of determinants."
    field: "math"
    x: 380
    y: 780
    prereq: ["det","cofactor"]
    used_by: []
  - slug: "inverse"
    title_zh: "逆矩阵"
    title_en: "Inverse Matrix"
    def_zh: "满足 AB = BA = I 的方阵 B。存在当且仅当行列式不为零。"
    def_en: "The square matrix B with AB = BA = I. It exists exactly when the determinant is nonzero."
    field: "math"
    x: 40
    y: 870
    prereq: ["matrix","det"]
    used_by: []
  - slug: "elementary"
    title_zh: "初等变换"
    title_en: "Elementary Operations"
    def_zh: "交换两行、某行乘非零数、某行加上另一行的倍数。它们不改变线性方程组的解集。"
    def_en: "Swap two rows, scale a row, or add a multiple of one row to another. The solution set is unchanged."
    field: "math"
    x: 205
    y: 870
    prereq: ["matrix"]
    used_by: ["rank"]
  - slug: "rank"
    title_zh: "矩阵的秩"
    title_en: "Rank"
    def_zh: "行阶梯形中非零行的个数，也是最大线性无关行（列）数。它衡量矩阵真正携带的信息量。"
    def_en: "The number of nonzero rows in row echelon form, equal to the largest independent set of rows or columns."
    field: "math"
    x: 380
    y: 870
    prereq: ["elementary"]
    used_by: ["vecgroup"]
  - slug: "lindep"
    title_zh: "线性相关性"
    title_en: "Linear Dependence"
    def_zh: "若存在不全为零的系数使组合等于零向量，则这组向量线性相关；否则线性无关。"
    def_en: "A set of vectors is dependent if some nontrivial combination equals zero, and independent otherwise."
    field: "math"
    x: 545
    y: 780
    prereq: ["matrix"]
    used_by: ["vecgroup","vecspace"]
  - slug: "vecgroup"
    title_zh: "向量组的秩"
    title_en: "Rank of a Vector Set"
    def_zh: "向量组中极大线性无关组所含向量的个数，等于以它们为列构成的矩阵的秩。"
    def_en: "The size of a maximal independent subset, equal to the rank of the matrix whose columns are those vectors."
    field: "math"
    x: 545
    y: 870
    prereq: ["lindep","rank"]
    used_by: []
  - slug: "eigens"
    title_zh: "特征值与特征向量"
    title_en: "Eigenvalues and Eigenvectors"
    def_zh: "满足 Ax = λx 的标量 λ 与向量 x：变换只把 x 拉长或压短，不改变方向。"
    def_en: "Scalars λ and vectors x with Ax = λx: the map stretches x without turning it."
    field: "math"
    x: 700
    y: 780
    prereq: ["det","lindep"]
    used_by: ["similar"]
  - slug: "similar"
    title_zh: "相似矩阵"
    title_en: "Similar Matrices"
    def_zh: "B = P^{-1}AP。它们是同一个线性变换在不同基下的两种写法，特征值完全相同。"
    def_en: "B = P^{-1}AP. Two coordinate descriptions of one linear map, with identical eigenvalues."
    field: "math"
    x: 700
    y: 870
    prereq: ["eigens"]
    used_by: ["quadratic"]
  - slug: "quadratic"
    title_zh: "二次型"
    title_en: "Quadratic Form"
    def_zh: "形如 x^T A x 的二次齐次多项式，A 取对称矩阵。化标准形就是把它对角化。"
    def_en: "A homogeneous degree-two polynomial x^T A x with A symmetric. Reducing it to standard form is diagonalisation."
    field: "math"
    x: 860
    y: 780
    prereq: ["similar","matrix"]
    used_by: ["positivedef"]
  - slug: "positivedef"
    title_zh: "正定性"
    title_en: "Positive Definiteness"
    def_zh: "对所有非零向量都有 x^T A x > 0。等价于全部特征值为正，也等价于各阶顺序主子式为正。"
    def_en: "x^T A x > 0 for every nonzero x; equivalently all eigenvalues are positive, or all leading principal minors are positive."
    field: "math"
    x: 860
    y: 870
    prereq: ["quadratic"]
    used_by: []
  - slug: "innerprod"
    title_zh: "内积与正交"
    title_en: "Inner Product and Orthogonality"
    def_zh: "内积给出长度与夹角；内积为零即正交。它是把几何直觉带进 n 维空间的工具。"
    def_en: "The inner product supplies length and angle; zero inner product means orthogonal. It carries geometry into n dimensions."
